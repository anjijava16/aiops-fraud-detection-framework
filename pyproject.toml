[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-fraud-detection-framework"
version = "0.1.0"
description = "AIOps-driven scalable fraud detection framework for financial systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "confluent-kafka>=2.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "catboost>=1.2.2",
    "shap>=0.43.0",
    "lime>=0.2.0.1",
    "imbalanced-learn>=0.11.0",
    "mlflow>=2.9.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-api>=1.21.0",
    "pyyaml>=6.0.1",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.92.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.package-dir]
"" = "."
